<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태양광 발전량 계산기</title>
<style>
body {
  font-family: 'Pretendard','Noto Sans KR',sans-serif;
  background:#f0f3f5;
  margin:0;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
}
.container {
  max-width:90%;
  width:100%;
  background:white;
  border-radius:18px;
  padding:40px;
  box-shadow:0 8px 30px rgba(0,0,0,0.1);
  border:1px solid #e0e0e0;
}
h2 {
  text-align:center;
  color:#1d3557;
  margin:-40px -40px 25px -40px;
  padding:20px 40px;
  background:#e8f0fe;
  border-radius:18px 18px 0 0;
}
.mode-select {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin:10px 0 20px 0;
  font-weight:600;
  color:#1d3557;
  font-size:0.9em;
}
.mode-select label {
  display:flex;
  align-items:center;
  gap:4px;
}
input, select {
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #a8b3c3;
  font-size:1em;
}
.result-box {
  background:#f2f7ff;
  padding:18px;
  border-radius:12px;
  margin-top:30px;
  color:#1d3557;
  border-left:5px solid #1d3557;
}
button {
  margin-top:30px;
  width:100%;
  background:#1d3557;
  color:white;
  font-size:1.1em;
  padding:14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 4px #163049;
}
button:hover { background:#0f223a; }
</style>
</head>
<body>
<div class="container">
  <h2>태양광 발전량 계산기</h2>

  <div class="mode-select">
    <label><input type="radio" name="mode" value="auto" checked> 자동 계산</label>
    <label><input type="radio" name="mode" value="manual"> 직접 입력</label>
  </div>

  <label for="site">부지 선택</label>
  <select id="site">
    <option value="">-- 선택하세요 --</option>
    <option value="산업단지">산업단지</option>
    <option value="주차장">주차장</option>
    <option value="철도 유휴부지">철도 유휴부지</option>
  </select>

  <label>패널 크기 (mm)</label>
  <div style="display:flex;gap:8px;">
    <input type="number" id="width" placeholder="가로(mm)">
    <input type="number" id="height" placeholder="세로(mm)">
  </div>

  <label for="power">모듈 최대출력 (W)</label>
  <input type="number" id="power" placeholder="예: 600">

  <label for="invest">투자 금액 (원)</label>
  <input type="number" id="invest" placeholder="예: 500000000">

  <label for="support">지원 금액 (원)</label>
  <input type="number" id="support" placeholder="예: 0">

  <div class="result-box" id="calcResult">입력값을 입력하면 계산 결과가 표시됩니다.</div>
  <button onclick="goToResult()">계산결과 보기</button>
</div>

<script>
function updateCalculation() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const site = document.getElementById("site").value;
  const width = parseFloat(document.getElementById("width").value);
  const height = parseFloat(document.getElementById("height").value);
  const power = parseFloat(document.getElementById("power").value);
  const resultDiv = document.getElementById("calcResult");

  if (!site) { resultDiv.innerHTML = "부지를 선택하세요."; return; }
  if (!width || !height || !power) { 
    resultDiv.innerHTML = "패널 크기와 출력값을 입력하세요."; return; 
  }

  resultDiv.innerHTML = `
    <b>모드:</b> ${mode === "auto" ? "자동 계산" : "직접 입력"}<br>
    <b>선택된 부지:</b> ${site}<br>
    <b>패널 크기:</b> ${width}mm × ${height}mm<br>
    <b>출력:</b> ${power}W
  `;
}

["mode","site","width","height","power","invest","support"].forEach(id=>{
  document.getElementById(id)?.addEventListener('input',updateCalculation);
});

function goToResult() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const site = document.getElementById('site').value;
  const width = document.getElementById('width').value;
  const height = document.getElementById('height').value;
  const power = document.getElementById('power').value;
  const invest = document.getElementById('invest').value;
  const support = document.getElementById('support').value;

  if(!site || !width || !height || !power) {
    alert("모든 값을 입력하세요!");
    return;
  }

  window.location.href = 
    `result.html?mode=${mode}&site=${site}&width=${width}&height=${height}&power=${power}&invest=${invest}&support=${support}`;
}
</script>
</body>
</html>
