<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>에너지 발전 영향 및 온실가스 감축 시뮬레이션</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background: #f8fafc;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .main-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-width: 400px;
    width: 100%;
    align-items: center;
    padding: 15px 10px;
    box-sizing: border-box;
  }
  .chart-box {
    background: white;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    width: 100%;
  }
  h2 {
    text-align: center;
    color: #1d3557;
    margin-bottom: 12px;
    font-size: 1.1em;
    font-weight: 700;
  }
  .button-group { text-align: center; margin-top: 10px; }
  button {
    padding: 6px 10px;
    margin: 0 3px;
    background: #1d3557;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.8em;
    transition: background 0.3s;
  }
  button:hover { background: #0f223a; }

  .chart-wrap {
    width: 100%;
    height: 320px;
    position: relative;
  }

  .chart-wrap > canvas {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .reduction-info {
    text-align: center;
    font-size: 0.85em;
    font-weight: 700;
    color: #1d3557;
    margin-top: 6px;
    line-height: 1.4em;
  }
  .info-value { color: #1E5631; font-size: 1em; margin-left: 4px; }
</style>
</head>
<body>

<div class="main-container">
  <!-- 발전량 도넛 -->
  <div id="doughnut-chart-area" class="chart-box">
    <h2>에너지원별 발전량 영향 분석</h2>
    <div class="chart-wrap">
      <canvas id="powerChart"></canvas>
    </div>
    <div class="button-group">
      <button id="show-before">기존 현황</button>
      <button id="show-after">감축 적용</button>
    </div>
  </div>

  <!-- 감축 기여도 -->
  <div id="contribution-chart-area" class="chart-box">
    <h2>인천시 2030년 목표 대비 온실가스 감축 기여도</h2>
    <div class="chart-wrap">
      <canvas id="contributionChart"></canvas>
    </div>
    <div class="reduction-info">
      잔여 감축 목표량 (2018년 대비 31.0%):
      <span id="target-reduction-amount" class="info-value">0</span> ktCO₂eq<br/>
      온실가스 예상 감축량:
      <span id="reduction-amount" class="info-value">0</span> ktCO₂eq
    </div>
  </div>
</div>

<script>
Chart.register();

/* ---------------- 기본 설정 ---------------- */
const emission2018 = 15894.70;
const INCHEON_TARGET_RATE = 0.31;
const reductionTarget_kt = emission2018 * INCHEON_TARGET_RATE;

/* ---------------- 부지별 실제 발전량 (보정·성능비 적용된 값) ---------------- */
const siteData = {
  산업단지: { area: 2558745.33, generation: 569682363 },
  주차장: { area: 109625, generation: 21511082 },
  철도: { area: 23880.111, generation: 4882023 }
};

/* 총 발전량 (kWh) */
const solarGenerationKWh =
  siteData.산업단지.generation +
  siteData.주차장.generation +
  siteData.철도.generation;

/* ---------------- 온실가스 감축량 계산 ---------------- */
const REDUCTION_FACTOR_KWH = 0.4781; // kWh당 감축계수 (kgCO₂eq/kWh)
const KILOGRAMS_TO_KILOTONNES = 1000000;
const totalReduction_kt = (solarGenerationKWh * REDUCTION_FACTOR_KWH) / KILOGRAMS_TO_KILOTONNES;
const remainingReductionNeeded = reductionTarget_kt - totalReduction_kt;

/* ---------------- 발전량 비율 시각화 ---------------- */
const dataBefore = {
  원자력: 188754,
  석탄: 167160,
  LNG: 167205,
  신재생: 63155,
  유류: 1204,
  양수: 4677,
  기타: 3413
};

/* 신재생 발전량 증가 반영 (kWh → GWh 변환) */
const newRenewableEnergy = 63155 + (solarGenerationKWh / 1_000_000);
const increaseValue = newRenewableEnergy - dataBefore.신재생;
const increasePercent = (increaseValue / dataBefore.신재생) * 100;
const dataAfter = { ...dataBefore, 신재생: newRenewableEnergy };

const labels = Object.keys(dataBefore);
const initialData = Object.values(dataBefore);
const finalData = Object.values(dataAfter);
const renewableIndex = labels.indexOf('신재생');

/* ---------------- 색상 ---------------- */
const geoPalette = [
  '#264653', '#457B9D', '#6BAED6', '#1E5631',
  '#A7C7E7', '#D1E3F8', '#9A8C98'
];

/* ---------------- 중앙 텍스트 ---------------- */
const centerTextPlugin = {
  id: 'centerTextPlugin',
  beforeDraw(chart, args, opts) {
    if (!opts || !opts.isAfter) return;
    const { ctx, chartArea } = chart;
    const cx = (chartArea.left + chartArea.right) / 2;
    const cy = (chartArea.top + chartArea.bottom) / 2;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 18px Pretendard';
    ctx.fillStyle = '#1E5631';
    ctx.fillText(`+${increaseValue.toLocaleString(undefined, { maximumFractionDigits: 2 })} GWh`, cx, cy);
    ctx.restore();
  }
};

let isAfter = true;

/* ---------------- 상단 도넛 ---------------- */
const ctx1 = document.getElementById('powerChart').getContext('2d');
const powerChart = new Chart(ctx1, {
  type: 'doughnut',
  data: {
    labels,
    datasets: [{
      data: finalData,
      backgroundColor: geoPalette,
      borderWidth: 2,
      borderColor: geoPalette.map((c, i) => i === renewableIndex ? '#1E5631' : '#fff'),
      offset: labels.map((_, i) => i === renewableIndex ? 18 : 0),
      hoverOffset: 18
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    cutout: '65%',
    animation: { duration: 900, easing: 'easeOutCubic' },
    plugins: {
      legend: { position: 'top', labels: { font: { size: 12, weight: 500 } } },
      tooltip: {
        callbacks: {
          label(ctx) {
            const label = ctx.label ?? '';
            const value = ctx.parsed;
            const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
            const pct = ((value / total) * 100).toFixed(2) + '%';
            let extra = '';
            if (ctx.label === '신재생' && isAfter) {
              extra = ` (+${increasePercent.toFixed(2)}%)`;
            }
            return `${label}: ${value.toLocaleString()} GWh (${pct})${extra}`;
          }
        }
      },
      centerTextPlugin: { isAfter: true }
    }
  },
  plugins: [centerTextPlugin]
});

/* ---------------- 버튼 ---------------- */
function updateChart(state) {
  const ds = powerChart.data.datasets[0];
  if (state === 'after') {
    isAfter = true;
    ds.data = finalData;
    ds.backgroundColor = geoPalette.map((c, i) => i === renewableIndex ? '#1E5631' : c);
    ds.borderColor = geoPalette.map((c, i) => i === renewableIndex ? '#1E5631' : '#fff');
    ds.offset = labels.map((_, i) => i === renewableIndex ? 25 : 0);
    powerChart.options.plugins.centerTextPlugin.isAfter = true;
  } else {
    isAfter = false;
    ds.data = initialData;
    ds.backgroundColor = geoPalette;
    ds.borderColor = '#fff';
    ds.offset = labels.map((_, i) => i === renewableIndex ? 6 : 0);
    powerChart.options.plugins.centerTextPlugin.isAfter = false;
  }
  powerChart.update();
}
document.getElementById('show-before').addEventListener('click', () => updateChart('before'));
document.getElementById('show-after').addEventListener('click', () => updateChart('after'));
updateChart('before');

/* ---------------- 하단 도넛 ---------------- */
new Chart(document.getElementById('contributionChart').getContext('2d'), {
  type: 'doughnut',
  data: {
    labels: ['온실가스 감축 기여', '잔여 감축 목표량'],
    datasets: [{
      data: [totalReduction_kt, remainingReductionNeeded],
      backgroundColor: ['#1E5631', '#6BAED6'],
      borderWidth: 1,
      hoverOffset: 10
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    cutout: '55%',
    plugins: {
      legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 10 } },
      tooltip: {
        callbacks: {
          label(ctx) {
            const label = ctx.label ?? '';
            const value = ctx.parsed;
            const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
            const pct = (value / total * 100).toFixed(2) + '%';
            return `${label}: ${value.toLocaleString(undefined,{maximumFractionDigits:2})} ktCO₂eq (${pct})`;
          }
        }
      }
    }
  }
});

/* ---------------- 결과 텍스트 ---------------- */
document.getElementById('target-reduction-amount').textContent =
  reductionTarget_kt.toLocaleString(undefined, { maximumFractionDigits: 2 });
document.getElementById('reduction-amount').textContent =
  totalReduction_kt.toLocaleString(undefined, { maximumFractionDigits: 2 });
</script>
</body>
</html>
